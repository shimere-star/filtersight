name: Apply SMS consent schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sms-consent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SMS consent changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text()

          old = '''            sms_phone = st.text_input(\n    "Phone number for SMS (optional)",\n    placeholder="+15551234567",\n)\n\n            sms_opt_in = st.checkbox(\n'''
          new = '''            sms_opt_in = st.checkbox(\n'''
          if old not in text:
              raise SystemExit('app.py: expected sms_phone block not found')
          text = text.replace(old, new, 1)

          old = '''                                "user_phone": user_phone or "",\n                                "accountability_phone": partner_phone or "",\n'''
          new = '''                                "user_phone": user_phone or "",\n                                "accountability_phone": partner_phone or "",\n                                "user_sms_opted_in": int(bool(sms_opt_in)),\n'''
          if old not in text:
              raise SystemExit('app.py: expected save-contact params not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          backend = Path('webhook_server.py')
          text = backend.read_text()

          text = text.replace('user_sms_opted_in INTEGER DEFAULT 1,', 'user_sms_opted_in INTEGER DEFAULT 0,', 1)
          old = '''    if "user_sms_opted_in" not in existing_cols:\n        conn.execute("ALTER TABLE customers ADD COLUMN user_sms_opted_in INTEGER DEFAULT 1")\n'''
          new = '''    if "user_sms_opted_in" not in existing_cols:\n        conn.execute("ALTER TABLE customers ADD COLUMN user_sms_opted_in INTEGER DEFAULT 0")\n        # Preserve legacy customers: under the old flow, having user_phone\n        # meant the customer had already supplied a texting number.\n        conn.execute("UPDATE customers SET user_sms_opted_in = 1 WHERE user_phone IS NOT NULL AND TRIM(user_phone) != ''")\n'''
          if old not in text:
              raise SystemExit('webhook_server.py: expected user_sms migration not found')
          text = text.replace(old, new, 1)

          old = '''async def save_contact(email: str, tier: str = "tier1", user_phone: str = "", accountability_phone: str = ""):\n'''
          new = '''async def save_contact(email: str, tier: str = "tier1", user_phone: str = "", accountability_phone: str = "", user_sms_opted_in: int = 0):\n'''
          if old not in text:
              raise SystemExit('webhook_server.py: save_contact signature not found')
          text = text.replace(old, new, 1)

          old = '''    db.execute(\n    """UPDATE customers\n       SET tier = ?, user_phone = ?, accountability_phone = ?\n       WHERE email = ?""",\n    (tier, user_phone or None, accountability_phone or None, email),\n    )\n'''
          new = '''    db.execute(\n    """UPDATE customers\n       SET tier = ?, user_phone = ?, accountability_phone = ?, user_sms_opted_in = ?\n       WHERE email = ?""",\n    (tier, user_phone or None, accountability_phone or None, int(bool(user_sms_opted_in)), email),\n    )\n'''
          if old not in text:
              raise SystemExit('webhook_server.py: save_contact UPDATE block not found')
          text = text.replace(old, new, 1)
          backend.write_text(text)
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sms-consent.yml
          git add app.py webhook_server.py
          git commit -m "Use user phone for SMS consent" -m "[skip ci]"
          git push
